# This file defines a workflow with separate jobs for build, test, publish, and deploy

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_call:  # lets Publish.yaml run CI before publishing

env:
  DOTNET_VERSION: 10.0.x
  # Master's coverage minus 1 point, rounded down to one decimal. A branch that raises coverage raises
  # them before its PR is opened, and sets them from the PR's CI gate line if that differs; never below
  # master's (CLAUDE.md, "Coverage").
  COVERAGE_MIN_LINE: 82.2
  COVERAGE_MIN_BRANCH: 71.7

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build --collect "XPlat Code Coverage" --results-directory TestResults
    - name: Coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.12
        reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -targetdir:coveragereport \
          "-reporttypes:Html;MarkdownSummaryGithub;JsonSummary"
        grep -v 'reportgenerator.io/pro' coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coveragereport
          TestResults/*/coverage.cobertura.xml
    - name: Coverage gate
      run: |
        # Numbers only: awk compares a null or missing value as text, and 'null' >= '82.2' is true
        line=$(jq -e '.summary.linecoverage | numbers' coveragereport/Summary.json) \
          || { echo "::error::Summary.json has no line coverage number"; exit 1; }
        branch=$(jq -e '.summary.branchcoverage | numbers' coveragereport/Summary.json) \
          || { echo "::error::Summary.json has no branch coverage number"; exit 1; }
        echo "Line $line% (minimum $COVERAGE_MIN_LINE%), branch $branch% (minimum $COVERAGE_MIN_BRANCH%)"
        awk -v l="$line" -v b="$branch" -v ml="$COVERAGE_MIN_LINE" -v mb="$COVERAGE_MIN_BRANCH" \
          'BEGIN { exit !(l >= ml && b >= mb) }' || { echo "::error::Coverage is below the minimum"; exit 1; }
