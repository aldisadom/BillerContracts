name: Publish
run-name: Publish ${{ inputs.package_version }}${{ github.ref_name != 'master' && format('-preview.{0}', github.run_number) || '' }}

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package version to publish (e.g. 1.2.3), one that is not on nuget.org yet. Runs from branches other than master publish 1.2.3-preview.<run number>'
        required: true

env:
  DOTNET_VERSION: 10.0.x

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/CI.yaml

  publish:
    name: Publish to NuGet.org
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package version
        id: version
        env:
          BASE_VERSION: ${{ github.event.inputs.package_version }}
        run: |
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package_version must be MAJOR.MINOR.PATCH, got '$BASE_VERSION'"
            exit 1
          fi

          VERSION="$BASE_VERSION"
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            VERSION="$BASE_VERSION-preview.${{ github.run_number }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version **$VERSION** from \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pack projects with resolved version
        run: dotnet pack -c Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: List artifacts
        run: ls -la ./artifacts || true

      # Before anything is pushed. A package that nuget.org already has at this version from this
      # commit is left out, so a run that failed halfway (Contracts pushed, Clients not) can run
      # again. From another commit, or when every package has it, the run fails instead of
      # publishing a mismatched pair or finishing green without publishing anything.
      - name: Leave out packages already on NuGet.org
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ github.event.inputs.package_version }}
        run: |
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::dotnet pack left no packages in ./artifacts"
            exit 1
          fi
          for package in "${packages[@]}"; do
            id="$(basename "$package" ".$VERSION.nupkg")"
            url="https://api.nuget.org/v3-flatcontainer/${id,,}/index.json"
            # || true: a network error gives code 000 and the error below, not a bare exit
            code="$(curl -s --retry 3 -o versions.json -w '%{http_code}' "$url" || true)"
            # 404: the package has never been published
            [ "$code" = 404 ] && continue
            if [ "$code" != 200 ]; then
              echo "::error::Could not check $url (HTTP $code)"
              exit 1
            fi
            # The list holds lowercase versions in quotes: {"versions":["5.0.0","5.1.0-preview.3"]}
            if [ "$VERSION" != "$BASE_VERSION" ] && grep -qF "\"$BASE_VERSION\"" versions.json; then
              echo "::error::$id $BASE_VERSION is already released, and a preview of it would sort below it. Run Publish again with a version that isn't on nuget.org yet"
              exit 1
            fi
            if grep -qF "\"${VERSION,,}\"" versions.json; then
              # The published .nuspec names the commit it was built from
              nuspec="https://api.nuget.org/v3-flatcontainer/${id,,}/${VERSION,,}/${id,,}.nuspec"
              code="$(curl -s --retry 3 -o package.nuspec -w '%{http_code}' "$nuspec" || true)"
              if [ "$code" != 200 ]; then
                echo "::error::Could not check $nuspec (HTTP $code). Re-run the job"
                exit 1
              fi
              commit="$(grep -o 'commit="[0-9a-f]*"' package.nuspec | head -n1 | cut -d'"' -f2 || true)"
              if [ "$commit" != "$GITHUB_SHA" ]; then
                echo "::error::$id $VERSION is already on nuget.org, built from commit ${commit:-unknown}. Run Publish again with a version that isn't on nuget.org yet"
                exit 1
              fi
              echo "::notice::$id $VERSION is already on nuget.org from this commit, so it is left out"
              rm "$package"
            fi
          done
          left=(./artifacts/*.nupkg)
          if [ ${#left[@]} -eq 0 ]; then
            # Only reached when every package came from this commit: the version is fully published
            echo "::error::Every package already has $VERSION on nuget.org from this commit, so it is fully published and this run has nothing to push"
            exit 1
          fi

      # Exchange the GitHub OIDC token for a short-lived (1h) NuGet API key
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json"
